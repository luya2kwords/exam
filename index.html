<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luya 2000-Word Question Bank System</title>
    <!-- 引入典雅字體 Cormorant Garamond 與 Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0; /* 典雅暖白背景 */
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* 背景微淡金色光澤 */
            background-image: radial-gradient(circle at 50% 50%, rgba(197, 160, 89, 0.06) 0%, transparent 75%);
        }

        /* 主公告卡片 */
        .notice-card {
            background-color: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 50px 45px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.04), 0 5px 15px rgba(0, 0, 0, 0.02);
            border: 1px solid #e6e0d2;
            text-align: center;
            position: relative;
            animation: fadeIn 1.2s ease-out;
        }

        /* 香檳金內邊框 */
        .notice-card::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            border: 1px solid rgba(197, 160, 89, 0.35);
            pointer-events: none;
            border-radius: 2px;
        }

        /* 標誌樣式：寬度 360px，下方留白 */
        .logo {
            max-width: 360px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto 40px auto; /* 下方加大邊距以達留空一行效果 */
        }

        /* 頂部小標題 */
        .notice-label {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #b89756; /* 柔和金屬金 */
            margin-bottom: 15px;
            font-weight: 400;
        }

        /* 分隔線 */
        .divider {
            width: 40px;
            height: 1px;
            background-color: #c5a059;
            margin: 0 auto 28px auto;
            opacity: 0.6;
        }

        /* 主要告示內容 */
        .notice-message {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.45rem;
            line-height: 1.6;
            color: #222222;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* 淡入動畫 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 行動裝置優化 */
        @media (max-width: 480px) {
            .notice-card {
                padding: 40px 25px;
            }
            .logo {
                max-width: 280px;
                margin-bottom: 28px;
            }
            .notice-message {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <main class="notice-card">
        <!-- 學校標誌 (圖檔 LUYA_LOGO2.png 須與 index.html 放在同一目錄) -->
        <img src="LUYA_LOGO2.png" alt="LUYA ACADEMY Logo" class="logo">
        
        <div class="notice-label">System Announcement</div>
        <div class="divider"></div>
        <p class="notice-message">
            This is the default website for the Luya 2000-Word Question Bank System, but it is not currently active.
        </p>
    </main>

</body>
</html>
